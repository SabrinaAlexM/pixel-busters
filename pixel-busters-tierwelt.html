<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Busters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#9F98AC;--bg2:#8C8599;--ink:#2B2140;--cream:#F6DDB7;--cream2:#E7C394;--accent:#FF4F8B;--danger:#E8343F;--blue:#3E7BEF;
  --bp:#1C4C8A;--bp-bg:#EDF3FC;--bp-line:#D3E1F5;--surface:#fff;--surface2:#F3F6FB;--muted:#5E5980;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#4A4458;--bg2:#3D3849;--cream:#E8CDA6;--cream2:#CFAE80;--bp:#A9CBFF;--bp-bg:#111A30;--bp-line:#1E2E50;--surface:#221E3C;--surface2:#2A2548;--muted:#B5AFD6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#4A4458;--bg2:#3D3849;--cream:#E8CDA6;--cream2:#CFAE80;--bp:#A9CBFF;--bp-bg:#111A30;--bp-line:#1E2E50;--surface:#221E3C;--surface2:#2A2548;--muted:#B5AFD6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);min-height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:"Fredoka","Arial Rounded MT Bold",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.screen{max-width:480px;margin:0 auto;padding:8px 10px 20px}
.screen[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.go{display:block;width:100%;background:var(--accent);color:#fff;font-weight:700;font-size:1.2rem;border-radius:18px;padding:.6em;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 4px 0 #B8235A;min-height:52px}
.go:active{transform:translateY(3px)}.go:disabled{opacity:.5}
.go.alt{background:#3FBF5A;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 4px 0 #1F8A47}
.go.blue{background:var(--bp);color:var(--bp-bg);box-shadow:none}
.ghostbtn{display:block;margin:6px auto 0;color:#6E6588;font-size:.88rem;text-decoration:underline;padding:.4em;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:36px}
.chip{background:rgba(43,33,64,.45);border-radius:99px;padding:.2em .7em;font-weight:700;font-size:.95rem;white-space:nowrap}
.chip.hot{background:var(--danger);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.icon{width:40px;height:40px;border-radius:13px;background:var(--blue);display:grid;place-items:center;font-size:1.05rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 2px 0 rgba(0,0,0,.2);flex:none}
/* Start */
#s-start{min-height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:26px;text-align:center}
#title{font-weight:700;font-size:clamp(50px,15vw,74px);line-height:.95;margin:0}
#title span{display:inline-block;color:var(--c);text-shadow:0 5px 0 rgba(0,0,0,.28),0 0 0 #000;-webkit-text-stroke:2px rgba(43,33,64,.55)}
#title span:nth-child(odd){transform:translateY(-3px) rotate(-4deg)}#title span:nth-child(3n){transform:translateY(3px) rotate(4deg)}
#crew{display:flex;gap:6px;align-items:flex-end;justify-content:center}
#crew canvas{animation:hop 1.1s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-10px)}}
.sub{font-size:1.15rem;opacity:.95;margin:0;text-shadow:0 2px 0 rgba(0,0,0,.2)}
#s-start .go{max-width:300px}
/* Karte */
.maptop{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:10px}
.maptop h2{margin:0;font-size:1.4rem;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.mapchips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
#map-nodes{display:flex;flex-direction:column-reverse;gap:14px;align-items:center;padding:10px 0 18px;position:relative}
.node{width:150px;background:var(--cream);color:var(--ink);border-radius:24px;padding:10px 10px 8px;box-shadow:inset 0 -6px 0 var(--cream2),0 5px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.node:nth-child(even){transform:translateX(52px)}.node:nth-child(odd){transform:translateX(-52px)}
.node.current{animation:bob 1.2s ease-in-out infinite;box-shadow:inset 0 -6px 0 var(--cream2),0 0 0 4px #FFD93B,0 5px 0 rgba(0,0,0,.2)}
@keyframes bob{50%{translate:0 -8px}}
.node.locked{background:#7E778F;box-shadow:inset 0 -6px 0 #6A647A;color:#fff}
.node-pic{width:76px;height:76px;display:grid;place-items:center;background:rgba(43,33,64,.12);border-radius:16px}
.node.locked .node-pic{background:transparent}
.lock{font-size:2rem}
.node-lab{font-weight:700;font-size:1.05rem}
.node-check{position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:50%;background:#3FBF5A;color:#fff;display:grid;place-items:center;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.2)}
/* Spiel */
.top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.pill{background:var(--blue);font-weight:700;border-radius:14px;padding:.25em .8em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{flex:1;display:flex;align-items:center;gap:6px;min-width:60px}
.bar{flex:1;height:12px;border-radius:99px;background:rgba(0,0,0,.25);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(#FFE15A,#FFB020);transition:width .2s}
.prog b{font-size:.85rem;min-width:3ch;text-align:right}
.chips{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;min-height:0;margin-bottom:4px}
#stage{position:relative;width:100%;display:flex;justify-content:center}
#cv{display:block;touch-action:manipulation}
.belt-info{position:absolute;left:4px;font-weight:700;font-size:1rem;text-shadow:0 2px 0 rgba(0,0,0,.45);pointer-events:none}
#slots{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:8px 2px 4px}
.slot{aspect-ratio:1;max-height:70px;border-radius:16px;background:var(--cream);box-shadow:inset 0 -5px 0 var(--cream2),0 3px 0 rgba(0,0,0,.18);display:grid;place-items:center}
.slot canvas,.jb canvas{width:100%;height:100%;display:block;pointer-events:none}
.slot.full-warn{animation:warn .5s ease-in-out infinite alternate}
@keyframes warn{to{box-shadow:inset 0 -5px 0 var(--cream2),0 0 0 3px var(--danger)}}
#lanes{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--bg2);border-radius:20px;padding:10px 6px 8px;box-shadow:inset 0 3px 6px rgba(0,0,0,.18);margin-top:6px}
.lane{display:flex;flex-direction:column;align-items:center;gap:2px}
.jb{width:100%;max-width:84px;aspect-ratio:1;display:block}
.jb.front:active canvas{transform:scale(.92)}
.jb.next{max-width:58px;opacity:.82}.jb.next2{max-width:46px;opacity:.6}
.more{font-size:.8rem;opacity:.85;min-height:1em}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ghost{position:fixed;left:0;top:0;width:48px;height:48px;pointer-events:none;z-index:40}.ghost canvas{width:100%;height:100%}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(43,33,64,.94);padding:.5em 1em;border-radius:16px;font-size:.92rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:90;width:max-content;max-width:calc(100% - 24px);text-align:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#toast.on{opacity:1}
/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(30,22,48,.6);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:50}
.overlay[hidden]{display:none}
.card{position:relative;background:#fff;color:var(--ink);border-radius:26px;padding:22px 20px 16px;width:min(380px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.2);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h2{margin:0 0 .3em;font-size:1.7rem}
.card p{margin:.3em 0 .7em;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.card .big{font-family:"Fredoka",system-ui,sans-serif;font-weight:700;font-size:2.1rem;margin:.1em 0}
.card .tip{font-size:.9rem;color:#6E6588}
.card .lifeline{font-weight:600;color:var(--danger)}
.mbtns,.endbtns{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.card.loud{background:linear-gradient(160deg,#FFE15A,#FF8A2B 55%,#FF4F8B);color:#2A1630}
.card.loud .ghostbtn{color:#5a2a3a}
.badge{position:absolute;top:-10px;right:14px;background:var(--danger);color:#fff;font-weight:700;border-radius:10px;padding:.2em .6em;transform:rotate(4deg)}
.cd{font-weight:700;background:#2A1630;color:#FFE15A;border-radius:10px;padding:.1em .5em}
.tinyx{position:absolute;top:6px;left:8px;width:26px;height:26px;border-radius:50%;opacity:0;font-size:13px;pointer-events:none;transition:opacity .4s;color:inherit}
.tinyx.on{opacity:.35;pointer-events:auto}
.adlabel{font-size:.72rem;opacity:.7;margin:0 0 .3em}
.adstatus{font-weight:600;min-height:1.2em}
.card.adbreak{background:linear-gradient(170deg,#7B3FE4,#E0409A);color:#fff;padding-top:30px}
.card.adbreak .tinyx{color:#fff;left:auto;right:8px}
.fakegame .candies{font-size:2.3rem;line-height:1.15;margin:.2em 0}
.fakegame h2{font-size:2rem;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.card.adbreak .go{background:#FFD93B;color:#5A1E7A;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15),0 4px 0 #C9A400}
.lb{list-style:none;padding:0;margin:.6em 0;font-family:system-ui,-apple-system,sans-serif}
.lb li{display:flex;justify-content:space-between;padding:.45em .7em;border-radius:12px}.lb li.me{background:#F1ECFA;font-weight:700}
.wheelwrap{position:relative;width:210px;margin:6px auto 4px}.wheel{width:100%;transform-origin:50% 50%;transition:transform 2.8s cubic-bezier(.12,.8,.18,1)}.wheel svg{width:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid #2A1630;z-index:2}
.stats{display:flex;justify-content:center;gap:18px;margin:.4em 0 .6em}.stats div{font-size:.8rem;color:#7A7090}.stats b{display:block;font-size:1.5rem;color:var(--ink)}
/* Auflösung (Blaupause) */
body.bpmode{background:var(--bp-bg);background-image:linear-gradient(var(--bp-line) 1px,transparent 1px),linear-gradient(90deg,var(--bp-line) 1px,transparent 1px);background-size:22px 22px}
#s-reveal{color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;-webkit-user-select:text;user-select:text}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #s-reveal{color:#F2EFFF}}
#s-reveal h1,#s-reveal h2,#s-reveal h3{font-family:"Fredoka",system-ui,sans-serif;color:var(--bp);line-height:1.15}
#s-reveal h1{font-size:2.2rem;margin:.4em 0 .3em}#s-reveal h2{font-size:1.3rem;margin:1.2em 0 .4em}#s-reveal h3{margin:0 0 .25em;font-size:1.08rem}
.quiz{display:flex;flex-direction:column;gap:8px;margin:12px 0 16px}
.qitem{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--bp-line);border-radius:14px;padding:.7em .9em;text-align:left;color:inherit;font-family:inherit;min-height:48px}
.qitem .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--bp);flex:none;display:grid;place-items:center;font-weight:700;color:var(--bp-bg)}
.qitem[aria-pressed="true"] .box{background:var(--bp)}.qitem[aria-pressed="true"] .box::after{content:"✓"}
.rcard{background:var(--surface);border:2px solid var(--bp-line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.rcard p{margin:0 0 .6em}
.res{border-left:6px solid var(--bp-line)}.res.hit{border-left-color:#2EA866}.res.miss{border-left-color:var(--danger)}
.facts{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 .45em;padding:0;list-style:none}
.facts li{font-size:.76rem;border-radius:99px;padding:.1em .6em;background:var(--surface2);color:var(--muted)}
.facts li.y{background:color-mix(in srgb,var(--bp) 18%,var(--surface));color:inherit}
.stats2 b{font-family:"Fredoka",system-ui,sans-serif;color:var(--bp);font-size:1.15rem}
.tl{list-style:none;padding:0;margin:0}.tl li{padding:.45em 0;border-bottom:1px solid var(--bp-line);font-size:.93rem}.tl li:last-child{border-bottom:0}
.tl .when{font-family:"Fredoka",system-ui,sans-serif;color:var(--bp);margin-right:.5em}.tl .ev{color:var(--muted)}
.note{font-size:.88rem;color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:.5em 0}.cmp div{background:var(--surface2);border-radius:12px;padding:.6em .7em}
.cmp b{font-family:"Fredoka",system-ui,sans-serif;font-size:1.25rem;color:var(--bp);display:block}
.refl li{margin-bottom:.5em}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<section id="s-start" class="screen">
  <h1 id="title" aria-label="Pixel Busters"></h1>
  <div id="crew" aria-hidden="true"></div>
  <p class="sub">Schiess tierische Pixelbilder weg!</p>
  <button class="go" id="btn-play">Spielen</button>
</section>
<section id="s-map" class="screen" hidden>
  <div class="maptop"><h2>Tierwelt</h2><div class="mapchips"><span class="chip" id="map-streak" hidden></span><span class="chip" id="map-lives" hidden></span><span class="chip" id="map-gems" hidden></span><button class="icon btn-sound" aria-label="Ton ausschalten">🔊</button></div></div>
  <div id="map-nodes"></div>
  <button class="go" id="btn-map-play">Spielen</button>
</section>
<section id="s-game" class="screen" hidden>
  <div class="top">
    <button class="icon" id="btn-back" aria-label="Zur Levelkarte">‹</button>
    <span class="pill" id="lvl-pill">Level 1</span>
    <div class="prog" aria-hidden="true"><div class="bar"><i id="bar"></i></div><b id="pct">0%</b></div>
    <button class="icon btn-sound" aria-label="Ton ausschalten">🔊</button>
    <button class="icon" id="btn-restart" aria-label="Level neu starten">↻</button>
  </div>
  <div class="chips"><span class="chip" id="chip-streak" hidden></span><span class="chip" id="chip-lives" hidden></span><span class="chip" id="chip-gems" hidden></span><span class="chip" id="chip-timer" hidden></span></div>
  <div id="stage"><canvas id="cv" aria-label="Spielfeld mit Pixelbild und Förderband"></canvas><div class="belt-info" id="belt-info"></div></div>
  <div id="slots"></div>
  <div id="lanes"></div>
  <div class="sr" aria-live="polite" id="live"></div>
</section>
<section id="s-reveal" class="screen" hidden>
  <h1>Moment mal.</h1>
  <p>Hast du gemerkt, was das Spiel ab dem Papagei mit dir gemacht hat? Tippe alles an, was dir aufgefallen ist.</p>
  <div class="quiz" id="quiz"></div>
  <button class="go blue" id="btn-solve">Auflösen</button>
  <div id="results"></div>
</section>
<div class="overlay" id="ov-end" hidden><div class="card" id="end-card"></div></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

/* ===================== Kernlogik (identisch mit dem Prüf-Solver) ===================== */
let GW=0,GH=0,PER=[];
function setGrid(rows){GH=rows.length;GW=rows[0].length;PER=[];
  for(let c=0;c<GW;c++)PER.push(['b',c]);for(let r=GH-1;r>=0;r--)PER.push(['r',r]);for(let c=GW-1;c>=0;c--)PER.push(['t',c]);for(let r=0;r<GH;r++)PER.push(['l',r]);}
function firstCube(g,[s,i]){
  if(s==='b'){for(let r=GH-1;r>=0;r--)if(g[r][i])return[r,i];}
  else if(s==='t'){for(let r=0;r<GH;r++)if(g[r][i])return[r,i];}
  else if(s==='r'){for(let c=GW-1;c>=0;c--)if(g[i][c])return[i,c];}
  else{for(let c=0;c<GW;c++)if(g[i][c])return[i,c];}
  return null;}
function lapSim(g,color,ammo){let h=0;for(const p of PER){if(!ammo)break;const t=firstCube(g,p);if(t&&g[t[0]][t[1]]===color){g[t[0]][t[1]]=null;ammo--;h++;}}return{h,ammo};}
const parseRows=rows=>rows.map(r=>[...r].map(c=>c==='.'?null:c));
const cp=g=>g.map(r=>r.slice());
const countLeft=g=>{let n=0;for(const r of g)for(const c of r)if(c)n++;return n;};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ===================== Grafik ===================== */
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  if(amt>0){r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt;}else{r*=1+amt;g*=1+amt;b*=1+amt;}
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawJelly(ctx,cx,cy,s,color,ammo,o={}){
  const sx=o.sx||1,sy=o.sy||1;
  ctx.save();ctx.translate(cx,cy+s*.04);ctx.scale(sx,sy);
  const w=s*.82,h=s*.72,x=-w/2,y=-h/2+s*.06,base=PAL[color];
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,y+h+s*.02,w*.45,s*.07,0,0,7);ctx.fill();
  ctx.fillStyle=shade(base,-.12);
  [-1,1].forEach(d=>{ctx.beginPath();ctx.moveTo(d*w*.42,y+s*.08);ctx.lineTo(d*w*.30,y-s*.16);ctx.lineTo(d*w*.12,y+s*.04);ctx.closePath();ctx.fill();});
  const gr=ctx.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,shade(base,.28));gr.addColorStop(.55,base);gr.addColorStop(1,shade(base,-.22));
  ctx.fillStyle=gr;rr(ctx,x,y,w,h,s*.24);ctx.fill();
  ctx.lineWidth=Math.max(1,s*.035);ctx.strokeStyle=shade(base,-.45);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(x+w*.27,y+h*.2,w*.13,h*.08,-.5,0,7);ctx.fill();
  const ey=y+h*.3,ex=w*.17,er=s*.06;
  ctx.fillStyle='#fff';[-1,1].forEach(d=>{ctx.beginPath();ctx.ellipse(d*ex,ey,er,er*1.15,0,0,7);ctx.fill();});
  ctx.fillStyle='#1E1630';[-1,1].forEach(d=>{ctx.beginPath();ctx.arc(d*ex+er*.15,ey+er*.15,er*.55,0,7);ctx.fill();});
  if(ammo!==undefined&&ammo!==null){
    const fs=Math.round(s*(String(ammo).length>1?.36:.4));
    ctx.font='700 '+fs+'px Fredoka, "Arial Rounded MT Bold", system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineJoin='round';ctx.lineWidth=Math.max(2,fs*.22);ctx.strokeStyle='rgba(30,20,50,.85)';ctx.strokeText(ammo,0,y+h*.68);
    ctx.fillStyle='#fff';ctx.fillText(ammo,0,y+h*.68);}
  ctx.restore();}
function jellyCanvas(color,ammo,px){const c=document.createElement('canvas'),d=Math.min(3,devicePixelRatio||1);
  c.width=c.height=Math.round(px*d);const x=c.getContext('2d');x.scale(d,d);drawJelly(x,px/2,px/2,px*.95,color,ammo);return c;}
function motifCanvas(rows,px,done){const c=document.createElement('canvas'),d=Math.min(3,devicePixelRatio||1),h=rows.length,w=rows[0].length,cs=px/Math.max(w,h);
  c.width=Math.round(w*cs*d);c.height=Math.round(h*cs*d);c.style.width=w*cs+'px';c.style.height=h*cs+'px';const x=c.getContext('2d');x.scale(d,d);
  rows.forEach((r,y)=>[...r].forEach((k,xx)=>{if(k==='.')return;x.fillStyle=done?PAL[k]:'rgba(255,255,255,.18)';rr(x,xx*cs+cs*.06,y*cs+cs*.06,cs*.88,cs*.88,cs*.2);x.fill();}));return c;}

function tone(f,d,type,v,slide,delay){if(!SND.on)return;const c=actx();if(!c)return;

/* ===================== Spielzüge ===================== */
function canPlay(){return G&&G.started&&!G.over&&!G.frozen&&!modalOpen;}
function launch(type,i){
  if(!canPlay())return;
  const j=type==='lane'?G.lanes[i][0]:G.slots[i];if(!j)return;
  const btn=$(type+i);
  if(G.riders.length+G.queue.length>=BELT_CAP){btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');toast('Band voll');return;}
  actx();if(type==='lane')G.lanes[i].shift();else G.slots[i]=null;
  G.moves++;G.queue.push({j,d:0,combo:0,nextWp:1,sq:0,born:performance.now()});
  sfx.launch();renderDom();
}
function admit(){while(G.queue.length){if(G.riders.some(r=>!r.gone&&r.d<V.gap))return;const R=G.queue.shift();R.born=performance.now();G.riders.push(R);G.maxPar=Math.max(G.maxPar,G.riders.length);}}
function step(dt){
  admit();

    while(R.nextWp<V.path.length&&V.path[R.nextWp].d<=R.d){const wp=V.path[R.nextWp];R.nextWp++;
      if(wp.p>=0&&R.j.ammo>0)tryShoot(R,wp);if(R.j.ammo===0){emptyOut(R);break;}}
    if(!R.gone&&R.d>=V.len)lapDone(R);if(G.over)return;
    R.sq=Math.max(0,R.sq-dt*6);}
  G.riders=G.riders.filter(R=>!R.gone);
  // Gratis-Pop-ups mitten im Level (nur Tricks-Levels)
  const frac=1-G.left/G.total;
  if(G.pats.has('hiddenX')&&!G.adShown&&frac>=.3){G.adShown=true;adModal();}
  else if(G.pats.has('nag')&&!G.nagShown&&frac>=.6){G.nagShown=true;nagModal();}
}
function tryShoot(R,wp){const t=firstCube(G.g,PER[wp.p]);if(!t)return;const [r,c]=t,k=G.g[r][c];if(k!==R.j.color)return;
  G.g[r][c]=null;G.left--;R.j.ammo--;R.combo++;R.sq=1;G.pending.set(r*GW+c,k);
  const to=cellC(r,c);
  G.shots.push({x0:wp.x,y0:wp.y,x1:to.x,y1:to.y,t:0,dur:reduceMotion?.01:Math.min(.16,.05+Math.hypot(to.x-wp.x,to.y-wp.y)/2600),r,c,k,combo:R.combo});

function lapDone(R){R.gone=true;const p=posAt(V.len);const k=G.slots.findIndex((s,i)=>!s&&!G.reserved[i]);
  if(k<0){G.overflow={j:R.j,p};overflow();return;}G.reserved[k]=true;renderDom();flyToSlot(R.j,p,k);}
function flyToSlot(j,p,k){const myG=G,cr=cv.getBoundingClientRect(),sr=$('slot'+k).getBoundingClientRect();
  const g=document.createElement('div');g.className='ghost';g.appendChild(jellyCanvas(j.color,j.ammo,48));document.body.appendChild(g);
  const x0=cr.left+p.x-24,y0=cr.top+p.y-24,x1=sr.left+sr.width/2-24,y1=sr.top+sr.height/2-24;
  const done=()=>{g.remove();if(G!==myG||G.over)return;G.reserved[k]=false;G.slots[k]=j;sfx.park();renderDom();
    const e=$('slot'+k);e&&e.animate&&e.animate([{transform:'scale(.7)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:260,easing:'ease-out'});};

/* ===================== Ende eines Levels ===================== */
async function win(){

  if(mode==='campaign'){streak++;ST.lv[levelIdx].winSec=dur;ST.lv[levelIdx].moves=G.moves;logEv({ev:'Level geschafft ('+G.moves+' Züge)'});if(levelIdx===unlocked)unlocked++;}
  if(mode==='compare'){ST.compare.winSec=dur;ST.compare.moves=G.moves;}
  renderHud();await sleep(reduceMotion?200:2000);
  const bonus=G.pats.has('gems')?'<p>+25 💎 Belohnung</p>':'';if(G.pats.has('gems'))gems+=25;
  endCard('<h2>Geschafft!</h2><div class="stats"><div><b>'+G.moves+'</b>Züge</div><div><b>'+Math.round(dur)+' s</b>Zeit</div><div><b>'+G.maxPar+'</b>gleichzeitig</div></div>'+bonus,
    [{label:mode==='compare'?'Zur Auswertung':'Weiter',fn:()=>{if(mode==='compare'){show('s-reveal');renderCompare();}else if(unlocked>=LEVELS.length)showReveal();else showMap();}}]);

  await sleep(700);lose('full');}
async function lose(reason){
  if(!G||G.over)return;G.frozen=true;
  if(reason!=='quit'&&(G.pats.has('streak')||G.pats.has('rewarded'))){
    const saved=await rescueModal(reason);
    if(!G||G.over)return;
    if(saved){
      if(reason==='full'){G.slots.push(null);G.reserved.push(false);renderDom();const k=G.slots.length-1;const o=G.overflow;G.overflow=null;G.reserved[k]=true;flyToSlot(o.j,o.p,k);}
      else G.timeLeft+=30;

  }
  G.over=true;G.frozen=false;
  logEv({ev:reason==='full'?'Level verloren: Warteplätze voll':reason==='time'?'Level verloren: Zeit abgelaufen':'Level abgebrochen'});
  if(mode==='campaign'){streak=0;if(G.pats.has('lives')){lives=Math.max(0,lives-1);markShown('lives');}}
  renderHud();
  const msg=reason==='full'?'Ein Jelly kam mit '+G.overflow.j.ammo+' Schuss zurück und fand keinen freien Platz.':reason==='time'?'Die Zeit ist abgelaufen.':'Level abgebrochen.';
  const lifeTxt=G.pats.has('lives')?'<p class="lifeline">'+(lives>0?'Du hast ein Leben verloren. Noch '+'❤️'.repeat(lives)+' übrig.':'Du hast kein Leben mehr!')+'</p>':'';

  endCard('<h2>Level verloren</h2><p>'+msg+'</p>'+lifeTxt+tip,[
    {label:'Nochmal',fn:async()=>{if(mode==='campaign'&&G.pats.has('lives')&&lives<=0){const ok=await livesModal();if(!ok){showMap();return;}}startLevel();}},
    {label:mode==='compare'?'Zur Auswertung':'Level überspringen',ghost:true,fn:()=>{if(mode==='compare'){show('s-reveal');renderCompare();return;}if(levelIdx===unlocked)unlocked++;if(unlocked>=LEVELS.length)showReveal();else showMap();}}]);
}
function endCard(html,btns){const ov=$('ov-end');$('end-card').innerHTML=html+'<div class="endbtns"></div>';const bar=$('end-card').querySelector('.endbtns');
  btns.forEach(b=>{const el=document.createElement('button');el.className=b.ghost?'ghostbtn':'go';el.textContent=b.label;el.onclick=()=>{ov.hidden=true;b.fn();};bar.appendChild(el);});

  if(mode==='compare'){G.over=true;show('s-reveal');renderCompare();return;}
  G.frozen=true;
  if(G.pats.has('streak')&&streak>0){markShown('streak');
    const keep=await modal({html:'<h2>Wirklich aufhören?</h2><p>Deine Siegesserie <b>🔥 '+streak+'</b> geht verloren.</p>',
      buttons:[{label:'Weiterspielen',v:true,primary:true,action:()=>markEngaged('streak')},shameBtn('Aufhören','Ja, ich werfe meine Serie weg',false)]});
    if(keep){G.frozen=false;return;}}
  else{const keep=await modal({counted:false,html:'<h2>Level verlassen?</h2><p>Der Fortschritt in diesem Level geht verloren.</p>',buttons:[{label:'Weiterspielen',v:true,primary:true},{label:'Verlassen',v:false,shame:true}]});if(keep){G.frozen=false;return;}}

/* ===================== Zeichnen ===================== */
function drawBelt(now){const {bx,by,bw,bh,T}=V;
  ctx.fillStyle='#7A5236';rr(ctx,2,2,V.W-4,V.H-4,T*.9);ctx.fill();
  ctx.fillStyle='#5A3A27';rr(ctx,T*.18,T*.18,V.W-T*.36,V.H-T*.36,T*.75);ctx.fill();
  ctx.fillStyle='#463227';rr(ctx,T*.28,T*.28,V.W-T*.56,V.H-T*.56,T*.65);ctx.fill();
  ctx.fillStyle='#8B5E3F';rr(ctx,bx-T*.22,by-T*.22,bw+T*.44,bh+T*.44,T*.4);ctx.fill();
  ctx.fillStyle='#B7B0C2';rr(ctx,bx-T*.08,by-T*.08,bw+T*.16,bh+T*.16,T*.3);ctx.fill();
  const moving=G.riders.length>0&&!G.frozen&&!modalOpen,off=moving?((now/1000)*V.speed*.5)%(T*1.6):0;
  ctx.strokeStyle='rgba(255,255,255,.13)';ctx.lineWidth=Math.max(2,T*.12);ctx.lineCap='round';ctx.lineJoin='round';
  for(let d=off;d<V.len;d+=T*1.6){const a=posAt(d),b=posAt(d+2),ang=Math.atan2(b.y-a.y,b.x-a.x),s=T*.18;
    ctx.beginPath();ctx.moveTo(a.x-Math.cos(ang-.9)*s,a.y-Math.sin(ang-.9)*s);ctx.lineTo(a.x,a.y);ctx.lineTo(a.x-Math.cos(ang+.9)*s,a.y-Math.sin(ang+.9)*s);ctx.stroke();}
  ctx.fillStyle='#C9A27A';rr(ctx,bx-T*.98,by+bh+T*.15,T*.45,T*.7,T*.12);ctx.fill();}
function drawCubes(){const {bx,by,cs}=V;
  for(let r=0;r<GH;r++)for(let c=0;c<GW;c++){const k=G.g[r][c]||G.pending.get(r*GW+c);if(k)ctx.drawImage(CUBE[k],bx+c*cs,by+r*cs,cs,cs);}
  for(const d of G.dying){const t=d.t/.2,s=t<.35?1+t*.8:Math.max(0,(1-t)/.65)*1.28,x=bx+(d.c+.5)*cs,y=by+(d.r+.5)*cs;
    ctx.globalAlpha=Math.max(0,1-t*.7);ctx.drawImage(CUBE[d.k],x-cs*s/2,y-cs*s/2,cs*s,cs*s);ctx.globalAlpha=1;}}
function drawWinReveal(now){const t=(now-G.winT)/1000,{bx,by,cs}=V,cx=GW/2,cy=GH/2;
  for(let r=0;r<GH;r++)for(let c=0;c<GW;c++){const k=G.orig[r][c];if(!k)continue;const delay=Math.hypot(r-cy,c-cx)*.028,u=Math.min(1,Math.max(0,(t-delay)/.3));if(u<=0)continue;
    const s=u<1?(u<.7?u/.7*1.2:1.2-(u-.7)/.3*.2):1;ctx.drawImage(CUBE[k],bx+(c+.5)*cs-cs*s/2,by+(r+.5)*cs-cs*s/2,cs*s,cs*s);}
  if(t>.9&&t<2){const u=(t-.9)/1.1,x=bx-V.bw*.3+u*V.bw*1.6,gr=ctx.createLinearGradient(x-60,0,x+60,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gr;ctx.fillRect(bx,by,V.bw,V.bh);}}
function drawShots(dt){for(const s of G.shots){s.t+=dt;const u=Math.min(1,s.t/s.dur),x=s.x0+(s.x1-s.x0)*u,y=s.y0+(s.y1-s.y0)*u,tl=Math.max(0,u-.35),xt=s.x0+(s.x1-s.x0)*tl,yt=s.y0+(s.y1-s.y0)*tl;
    ctx.lineCap='round';ctx.strokeStyle=PAL[s.k];ctx.globalAlpha=.55;ctx.lineWidth=V.cs*.55;ctx.beginPath();ctx.moveTo(xt,yt);ctx.lineTo(x,y);ctx.stroke();
    ctx.globalAlpha=1;ctx.strokeStyle='#fff';ctx.lineWidth=V.cs*.28;ctx.beginPath();ctx.moveTo(xt,yt);ctx.lineTo(x,y);ctx.stroke();if(u>=1){s.done=true;impact(s);}}

function drawRiders(now){const s=V.T*1.25;
  G.queue.forEach((R,i)=>{const p=V.path[0];drawJelly(ctx,p.x-V.T*.1,p.y-i*V.T*.35,s*.9,R.j.color,R.j.ammo,{sy:1+Math.sin(now/120+i)*.04});});
  for(const R of G.riders){if(R.gone)continue;const p=posAt(R.d),born=Math.min(1,(now-R.born)/180),pop=born<1?.6+born*.4:1;
    drawJelly(ctx,p.x,p.y,s*pop,R.j.color,R.j.ammo,{sx:1+R.sq*.14,sy:1-R.sq*.12});
    if(R.combo>=3){ctx.font='700 '+Math.round(V.T*.55)+'px Fredoka, system-ui, sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(30,20,50,.8)';ctx.strokeText('×'+R.combo,p.x,p.y-s*.62);ctx.fillStyle='#FFE15A';ctx.fillText('×'+R.combo,p.x,p.y-s*.62);}}}
function drawParts(dt){for(const p of G.parts){p.t+=dt;p.vy+=(p.conf?40:380)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const a=1-p.t/p.life;if(a<=0){p.dead=true;continue;}
    ctx.globalAlpha=Math.min(1,a*1.4);ctx.fillStyle=p.col;if(p.conf){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot+p.t*6);ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}else ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);}

    ctx.globalAlpha=a;ctx.font='700 '+Math.round(sz)+'px Fredoka, system-ui, sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(30,20,50,.85)';ctx.strokeText(f.txt,f.x,f.y-30-f.t*40);ctx.fillStyle=f.big?'#FFE15A':'#fff';ctx.fillText(f.txt,f.x,f.y-30-f.t*40);}
  ctx.globalAlpha=1;G.floats=G.floats.filter(f=>!f.dead);}
let last=performance.now(),domTick=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G&&!$('s-game').hidden){
    const paused=G.over||G.frozen||modalOpen||document.hidden||!G.started;
    if(!paused){step(dt);
      if(G.pats.has('timer')&&!G.over){G.timeLeft=Math.max(0,G.timeLeft-dt);if(G.timeLeft<=0&&!G.timeoutPending){G.timeoutPending=true;G.frozen=true;timeModal().then(ok=>{if(!G||G.over)return;if(ok){G.timeLeft+=30;G.timeoutPending=false;G.frozen=false;}else lose('time');});}}}
    if(!(G.frozen||modalOpen))for(const d of G.dying)d.t+=dt;G.dying=G.dying.filter(d=>d.t<.2);
    ctx.clearRect(0,0,V.W,V.H);drawBelt(now);
    if(G.won)drawWinReveal(now);else drawCubes();
    drawShots(paused&&!G.won?0:dt);if(!G.won)drawRiders(now);drawParts(dt);
    domTick+=dt;if(domTick>.25){domTick=0;renderTimer();const danger=slotsUsed()>=G.slots.length&&G.riders.some(r=>!r.gone&&r.j.ammo>0);
      document.querySelectorAll('.slot').forEach(s=>s.classList.toggle('full-warn',danger));$('belt-info').textContent='🛹 '+(BELT_CAP-G.riders.length-G.queue.length)+'/'+BELT_CAP;}
  }
  requestAnimationFrame(frame);}
window.addEventListener('resize',()=>{if(G&&!$('s-game').hidden)layout();});
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(G&&!$('s-game').hidden)renderDom();});

/* ===================== Dialoge (Tricks) ===================== */
function decline(normal,shame){if(G&&G.pats.has('confirm')){markShown('confirm');return shame;}return normal;}
function shameBtn(normal,shame,v){const isShame=!!(G&&G.pats.has('confirm'));return{label:decline(normal,shame),v,shame:true,action:()=>{if(isShame)markEngaged('confirm');}};}
function price(n){return n+' 💎';}
function fakeBuy(chf){if(mode==='campaign'){ST.fakeBuys++;ST.fakeChf+=chf;}toast('Demo: Es fliesst kein Geld. Ein echtes Spiel hätte dir jetzt CHF '+chf.toFixed(2)+' abgebucht.',3200);}
function modal({html,buttons=[],counted=true,cls='',onMount}){
  return new Promise(res=>{
    modalOpen=true;if(counted&&mode==='campaign')ST.popups++;
    const t0=Date.now(),root=$('modal-root');
    const ov=document.createElement('div');ov.className='overlay';
    const box=document.createElement('div');box.className='card modal '+cls;box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');
    box.innerHTML=html;const bar=document.createElement('div');bar.className='mbtns';let done=false;
    const close=v=>{if(done)return;done=true;
      if(counted&&mode==='campaign'){ST.popupMs+=Date.now()-t0;logEv({title:(box.querySelector('h2')||{}).textContent||'Pop-up',choice:box._choice||'geschlossen',ms:Date.now()-t0});}
      if(box._cleanup)box._cleanup();ov.remove();modalOpen=root.children.length>0;res(v);};
    buttons.forEach(b=>{const el=document.createElement('button');el.className=b.primary?'go':b.shame?'ghostbtn':'go alt';el.textContent=b.label;
      el.onclick=async()=>{if(done)return;box._choice=b.label;if(b.action){const r=await b.action(el,close,box);if(r===false)return;}close(b.v);};bar.appendChild(el);});
    if(buttons.length)box.appendChild(bar);ov.appendChild(box);root.appendChild(ov);
    if(onMount)onMount(box,close);const f=box.querySelector('.mbtns button');if(f)f.focus({preventScroll:true});
  });}
async function pay(n){
  if(gems<n){const ok=await shopModal(n);if(!ok||gems<n)return false;}
  gems-=n;if(mode==='campaign')ST.gemsSpent+=n;markEngaged('gems');renderHud();sfx.coin();return true;}
function shopModal(n){const txt=()=>'Du brauchst '+n+' 💎 und hast '+gems+' 💎.';
  return modal({cls:'loud',html:'<h2>Zu wenig 💎</h2><p id="shop-txt">'+txt()+'</p>',
    buttons:[{label:'50 💎 für CHF 1.90',v:true,primary:true,action:(el,close,box)=>{fakeBuy(1.9);gems+=50;renderHud();if(gems>=n)return;box.querySelector('#shop-txt').textContent='Immer noch zu wenig. '+txt();return false;}},
      {label:'550 💎 für CHF 14.90 (Bestseller)',v:true,action:(el,close,box)=>{fakeBuy(14.9);gems+=550;renderHud();if(gems>=n)return;return false;}},
      shameBtn('Abbrechen','Nein, ich bleibe lieber arm',false)]});}
/* simuliertes Werbevideo */
function videoAd(box,label){return new Promise(async r=>{const st=box.querySelector('.adstatus');for(let s=6;s>0;s--){if(st)st.textContent=label+' … '+s;await sleep(1000);}if(st)st.textContent='';r();});}
function timeModal(){

      shameBtn('Aufgeben','Nein, ich gebe einfach auf',false)]});}
function rescueModal(reason){

  if(G.pats.has('rewarded'))btns.push({label:'▶ Video ansehen: gratis weiter',v:true,primary:!btns.length,action:async(el,close,box)=>{el.disabled=true;markEngaged('rewarded');await videoAd(box,'Werbung läuft');}});

function offerModal(){markShown('offer');

    buttons:[{label:'Jetzt für CHF 2.90 holen',v:1,primary:true,action:()=>{fakeBuy(2.9);gems+=200;markEngaged('offer');renderHud();}},shameBtn('Nein danke','Nein danke, ich spiele lieber schlecht',0)],
    onMount:box=>{let s=30;const el=box.querySelector('#offer-cd');const h=setInterval(()=>{s=s<=0?30:s-1;el.textContent='0:'+String(s).padStart(2,'0');},1000);box._cleanup=()=>clearInterval(h);}});}
function adModal(){markShown('hiddenX');
  return modal({cls:'loud',html:'<button class="tinyx" id="ad-x" aria-label="Werbung schliessen">✕</button><p class="adlabel">Werbung</p><h2>Jelly GOLD-Pass</h2><p>Doppelte 💎, unendlich Leben, exklusive Jellys!</p><p class="adstatus" aria-live="polite"></p>',
    buttons:[{label:'▶ Video ansehen: +30 💎',v:1,primary:true,action:async(el,close,box)=>{el.disabled=true;markEngaged('hiddenX');await videoAd(box,'Werbevideo läuft');gems+=30;renderHud();}}],
    onMount:(box,close)=>{const x=box.querySelector('#ad-x');const h=setTimeout(()=>x.classList.add('on'),4000);x.onclick=()=>{box._choice='kleines ✕ gefunden und geschlossen';close(0);};box._cleanup=()=>clearTimeout(h);}});}
function nagModal(){markShown('nag');
  return modal({html:'<h2>Lea hat dich überholt!</h2><ul class="lb"><li><span>1. Lea</span><span>12 410</span></li><li class="me"><span>2. Du</span><span>12 380</span></li><li><span>3. Noah</span><span>11 120</span></li></ul><p>Lade 3 Freunde ein und erhalte einen Booster, um sie wieder einzuholen.</p>',
    buttons:[{label:'Freunde einladen',v:1,primary:true,action:()=>{markEngaged('nag');toast('Demo: Hier hättest du dem Spiel Zugriff auf deine Kontakte gegeben. Es wurde nichts geteilt.',3200);}},shameBtn('Später','Nein, ich bleibe lieber hinten',0)]});}
function adBreakModal(){markShown('adbreak');
  return modal({cls:'adbreak',html:'<p class="adlabel">Anzeige</p><div class="fakegame"><div class="candies">🍬🍭🍫🍬<br>🍭🍫🍬🍭<br>🍫🍬🍭🍫</div><h2>Sugar Swap Saga</h2><p>Über 2000 süsse Level! ★★★★★</p></div><button class="go" id="ad-cta">Jetzt gratis laden</button><button class="tinyx" id="ad-x2" aria-label="Werbung schliessen">✕</button><p class="adstatus" id="ad-cd" aria-live="polite">Schliessen in 5</p>',
    onMount:(box,close)=>{const x=box.querySelector('#ad-x2'),cd=box.querySelector('#ad-cd');let s=5;

      box.querySelector('#ad-cta').onclick=()=>{markEngaged('adbreak');toast('Demo: Hier würde der App Store öffnen. Es wurde nichts geladen.',3000);};
      x.onclick=()=>{box._choice='nach '+(5)+' s Wartezeit geschlossen';close(0);};box._cleanup=()=>clearInterval(h);}});}
function livesModal(){markShown('lives');
  return modal({cls:'loud',html:'<h2>Keine Leben mehr</h2><p class="big">💔</p><p>Nächstes Leben in <span class="cd" id="life-cd">29:59</span></p><p class="adstatus" aria-live="polite"></p>',
    buttons:[{label:'5 Leben für '+price(90),v:true,primary:true,action:async()=>{const ok=await pay(90);if(!ok)return false;lives=5;markEngaged('lives');}},
      {label:'▶ Video ansehen: +1 Leben',v:true,action:async(el,close,box)=>{el.disabled=true;markEngaged('rewarded');markShown('rewarded');markEngaged('lives');await videoAd(box,'Werbung läuft');lives=1;}},
      shameBtn('Warten','Ich warte lieber eine halbe Stunde',false)],
    onMount:box=>{let s=1799;const el=box.querySelector('#life-cd');const h=setInterval(()=>{s--;el.textContent=fmtT(s);},1000);box._cleanup=()=>clearInterval(h);}});}
const WVALS=['5','10','500','10','5','20','5','15'];
function wheelSvg(){const cols=['#FF8FBC','#3F7CF0','#FFD93B','#3F7CF0','#33C6E0','#F7922B','#3FBF5A','#3F7CF0'];let s='<svg viewBox="-105 -105 210 210" aria-hidden="true">';
  for(let i=0;i<8;i++){const a0=(i*45-90)*Math.PI/180,a1=((i+1)*45-90)*Math.PI/180,r=100;
    s+='<path d="M0,0 L'+(r*Math.cos(a0)).toFixed(1)+','+(r*Math.sin(a0)).toFixed(1)+' A'+r+','+r+' 0 0 1 '+(r*Math.cos(a1)).toFixed(1)+','+(r*Math.sin(a1)).toFixed(1)+' Z" fill="'+cols[i]+'" stroke="#fff" stroke-width="2"/>';
    s+='<text transform="rotate('+(i*45+22.5)+') translate(0,-66)" text-anchor="middle" dominant-baseline="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="'+(i===2?15:16)+'" fill="'+(i===2?'#2A1630':'#fff')+'">'+(i===2?'JACKPOT':WVALS[i])+'</text>';}
  return s+'<circle r="14" fill="#2A1630"/></svg>';}
const segAt=deg=>Math.floor((((-deg)%360)+360)%360/45);
function wheelModal(){markShown('wheel');
  return modal({cls:'loud',html:'<h2>Gratis-Glücksrad!</h2><div class="wheelwrap"><div class="pointer"></div><div class="wheel" id="wheel">'+wheelSvg()+'</div></div><p id="wh-msg" aria-live="polite">Ein Dreh ist geschenkt. Jackpot: 500 💎</p>',
    onMount:(box,close)=>{const w=box.querySelector('#wheel'),msg=box.querySelector('#wh-msg');const btns=document.createElement('div');btns.className='mbtns';box.appendChild(btns);
      const mk=(label,cls,fn)=>{const b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=e=>{box._choice=(box._choice&&box._choice!==label?box._choice+', dann ':'')+label;fn(e);};btns.appendChild(b);return b;};
      const spin=async deg=>{w.style.transform='rotate('+deg+'deg)';await sleep(reduceMotion?50:2950);return +WVALS[segAt(deg)];};
      const first=mk('Gratis drehen','go',async()=>{markEngaged('wheel');btns.innerHTML='';const v=await spin(360*5+272);gems+=v;renderHud();sfx.coin();msg.innerHTML='<b>'+v+' 💎!</b> Sooo knapp am Jackpot vorbei!';
        mk('Nochmal drehen für '+price(30),'go',async()=>{const ok=await pay(30);if(!ok)return;markEngaged('wheel');btns.innerHTML='';const v2=await spin(360*10+223);gems+=v2;renderHud();msg.innerHTML='<b>'+v2+' 💎.</b> Wieder ganz knapp! Morgen gibt es einen neuen Gratis-Dreh.';mk('Weiter','go',()=>close(1)).focus();});
        mk(decline('Weiter','Nein, ich verzichte auf den Jackpot'),'ghostbtn',()=>{if(G&&G.pats.has('confirm'))markEngaged('confirm');close(0);});});
      mk('Überspringen','ghostbtn',()=>close(0));first.focus();}});}

/* ===================== Auflösung ===================== */
const quizSel=new Set();
function showReveal(){
  show('s-reveal');const keys=[...Object.keys(PAT),...Object.keys(DISTRACT)];const R=rng(7);keys.sort(()=>R()-.5);
  const q=$('quiz');q.innerHTML='';$('results').innerHTML='';$('btn-solve').hidden=false;quizSel.clear();
  keys.forEach(k=>{const it=PAT[k]||DISTRACT[k];const b=document.createElement('button');b.className='qitem';b.setAttribute('aria-pressed','false');
    b.innerHTML='<span class="box"></span><span>'+it.q+'</span>';b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);on?quizSel.add(k):quizSel.delete(k);};q.appendChild(b);});
}
$('btn-solve').onclick=()=>{
  $('btn-solve').hidden=true;document.querySelectorAll('.qitem').forEach(b=>b.disabled=true);
  let h='<h2>Was wirklich drin war</h2><div class="rcard stats2"><p>Du hast <b>'+ST.popups+'</b> Pop-ups gesehen und darin <b>'+Math.round(ST.popupMs/1000)+' s</b> verbracht. Du hast <b>'+ST.gemsSpent+' 💎</b> ausgegeben und <b>'+ST.fakeBuys+'-mal</b> auf einen Echtgeld-Knopf getippt'+(ST.fakeBuys?' (zusammen <b>CHF '+ST.fakeChf.toFixed(2)+'</b>, nur simuliert)':'')+'.</p><p style="margin:0">Frosch und Fuchs waren das reine Spiel. Papagei und Eule hatten genau dieselbe Spielmechanik, nur mit eingebauten Tricks.</p></div>';
  [...Object.keys(PAT),...Object.keys(DISTRACT)].forEach(k=>{
    const real=!!PAT[k],it=PAT[k]||DISTRACT[k],noticed=quizSel.has(k),armed=ST.armed.has(k),sh=ST.shown[k]||0,en=ST.engaged[k]||0;
    let cls='nope';if(real&&sh)cls=noticed?'hit':'miss';else if(!real&&noticed)cls='miss';
    let f='';
    if(real){f+='<li class="'+(armed?'y':'')+'">'+(armed?'eingebaut':'nicht eingebaut')+'</li><li class="'+(sh?'y':'')+'">'+(sh?'angezeigt'+(sh>1?' ('+sh+'×)':''):'bei dir nicht ausgelöst')+'</li><li class="'+(en?'y':'')+'">'+(en?'du: '+it.eng+(en>1?' ('+en+'×)':''):'du: nicht darauf eingegangen')+'</li>';}
    else f+='<li>kam nicht vor</li>';
    f+='<li class="'+(noticed?'y':'')+'">'+(noticed?'von dir angekreuzt':'nicht angekreuzt')+'</li>';
    h+='<div class="rcard res '+cls+'"><h3>'+it.name+'</h3><ul class="facts">'+f+'</ul><p>'+it.desc+'</p></div>';});
  h+=timelineHtml();
  h+='<h2>Vergleichsrunde</h2><div class="rcard" id="cmp-box"></div>';
  h+='<h2>Für die Diskussion</h2><div class="rcard"><ol class="refl"><li>Bei welchem Trick hast du am längsten gezögert? Woran lag das?</li><li>Welche dieser Mechanismen wirken bei 9- bis 12-Jährigen vermutlich am stärksten, welche kaum?</li><li>Was unterscheidet eine faire Belohnung, zum Beispiel Konfetti für ein gelöstes Level, von einem manipulativen Mechanismus?</li><li>Wie könntest du mit einer 5. oder 6. Klasse über solche Tricks sprechen, ohne Games pauschal schlechtzumachen?</li></ol></div>';
  $('results').innerHTML=h;renderCompare();$('results').scrollIntoView({behavior:reduceMotion?'auto':'smooth'});
};
function timelineHtml(){if(!ST.log.length)return'';
  let h='<h2>Deine Zeitleiste</h2><div class="rcard"><p class="note">Die Zeit zählt ab Spielbeginn im jeweiligen Level.</p><ul class="tl">';let last=0;
  ST.log.forEach(e=>{if(e.lvl!==last){last=e.lvl;const a=ST.lv[e.lvl-1]?ST.lv[e.lvl-1].attempts:1;h+='<li><b>Level '+e.lvl+' ('+LEVELS[e.lvl-1].name+')</b>, '+a+' Versuch'+(a>1?'e':'')+'</li>';}
    if(e.title)h+='<li><span class="when">'+fmtT(e.at)+'</span>'+e.title+': «'+e.choice+'» nach '+(e.ms/1000).toFixed(1).replace('.',',')+' s</li>';
    else h+='<li><span class="when">'+fmtT(e.at)+'</span><span class="ev">'+e.ev+'</span></li>';});
  return h+'</ul></div>';}
function renderCompare(){const box=$('cmp-box');if(!box)return;const a=ST.lv[2]||{},c=ST.compare;
  let h='<p>Spiel den Papagei nochmals, mit genau denselben Jellys, aber ohne Uhr, Werbung, Angebote und Edelsteine. Achte darauf, wie sich das anfühlt.</p>';
  if(c&&c.winSec)h+='<div class="cmp"><div>Mit Tricks<b>'+(a.winSec?fmtT(a.winSec):'nicht geschafft')+'</b>'+(a.attempts||1)+' Versuch'+((a.attempts||1)>1?'e':'')+'</div><div>Ohne Tricks<b>'+fmtT(c.winSec)+'</b>'+c.attempts+' Versuch'+(c.attempts>1?'e':'')+'</div></div><p>Gleiches Puzzle, gleiche Schwierigkeit. Was sich verändert hat, kam allein von den Tricks.</p>';
  h+='<button class="go blue" id="btn-cmp">'+(c&&c.winSec?'Nochmals ohne Tricks spielen':'Papagei ohne Tricks spielen')+'</button>';
  box.innerHTML=h;$('btn-cmp').onclick=()=>{mode='compare';startLevel();};}
